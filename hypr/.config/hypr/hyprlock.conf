# Minimal, Ly-style lock screen: flat terminal background, one bordered box.
# Palette: bg #282828 (kitty), fg #ebdbb2, muted #928374. Box border matches
# hyprland.lua's active_border (rgba(d5c4a1ee), 2px) -- keep them in sync.

general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(40, 40, 40, 1.0)
}

# The box
shape {
    monitor =
    size = 380, 110
    color = rgba(40, 40, 40, 1.0)
    rounding = 0
    border_size = 2
    border_color = rgba(213, 196, 161, 0.93)

    position = 0, 0
    halign = center
    valign = center
}

# login: <user>
label {
    monitor =
    text = login: $USER
    color = rgba(235, 219, 178, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono

    position = 0, 20
    halign = center
    valign = center
}

# password: (typed characters show as *)
input-field {
    monitor =
    size = 340, 34
    outline_thickness = 0
    rounding = 0

    inner_color = rgba(0, 0, 0, 0.0)
    font_color = rgba(235, 219, 178, 1.0)
    font_family = JetBrainsMono Nerd Font Mono

    dots_text_format = *
    dots_center = true
    fade_on_empty = false
    hide_input = false

    placeholder_text = password:
    fail_text = wrong password

    position = 0, -20
    halign = center
    valign = center
}

# tiny clock, same format as waybar
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(146, 131, 116, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono

    position = 0, 40
    halign = center
    valign = bottom
}
