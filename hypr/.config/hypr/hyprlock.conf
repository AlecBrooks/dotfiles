# Minimal, Ly-style lock screen: flat terminal background, one bordered box.
# Colors come from the wallpaper (generated by ~/bin/wallpaper-theme -> matugen):
# $bg $fg $muted $accent $fail. The box border uses $accent, the same color as
# Hyprland's active window border.
source = /home/mythra/.cache/wallpaper-theme/hyprlock-colors.conf

general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $bg
}

# The box
shape {
    monitor =
    size = 380, 110
    color = $bg
    rounding = 0
    border_size = 2
    border_color = $accent

    position = 0, 0
    halign = center
    valign = center
}

# login: <user>
label {
    monitor =
    text = login: $USER
    color = $fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono

    position = 0, 20
    halign = center
    valign = center
}

# password: (typed characters show as *)
input-field {
    monitor =
    size = 340, 34
    outline_thickness = 0
    rounding = 0

    inner_color = rgba(0, 0, 0, 0.0)
    font_color = $fg
    font_family = JetBrainsMono Nerd Font Mono

    dots_text_format = *
    dots_center = true
    fade_on_empty = false
    hide_input = false

    placeholder_text = password:
    fail_text = wrong password

    position = 0, -20
    halign = center
    valign = center
}

# tiny clock, same format as waybar
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = $muted
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono

    position = 0, 40
    halign = center
    valign = bottom
}
