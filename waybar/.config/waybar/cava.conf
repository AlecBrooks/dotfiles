[general]
framerate = 30
autosens = 1
sensitivity = 130
bars = 12
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
channels = stereo
reverse = 0
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 0
frame_delimiter = 10

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 0.77