<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23282828'/><rect x='3' y='3' width='10' height='3' fill='%23bcc8d3'/><rect x='3' y='8' width='10' height='3' fill='%23bcc8d3'/></svg>">
<!-- base look + fallback colors, then the wallpaper palette (regenerated by ~/bin/wallpaper-theme) -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="file:///home/mythra/.cache/wallpaper-theme/startpage-colors.css">
</head>
<body>
<header>
  <div class="prompt"><span class="user">alec</span><span class="at">@</span><span class="host">stack</span><span class="dim">:~$</span>
    <input id="filter" type="text" placeholder="type to filter, enter to open" autocomplete="off" autofocus spellcheck="false">
  </div>
  <div class="clock" id="clock"></div>
</header>

<main id="groups"></main>

<footer><span class="dot up"></span> up <span class="dot down"></span> down <span class="dot off"></span> off <span class="dot unknown"></span> not checked
  <span class="sep">|</span> colors follow the wallpaper <span class="sep">|</span> ~/dotfiles/startpage</footer>

<script>
// check: true = ping it for the status dot (plain fetch, no-cors: any answer counts as up)
const GROUPS = [
  { name: "Server", items: [
    { name: "Unraid",       icon: "", url: "http://192.168.0.10:8088",        sub: "192.168.0.10:8088", check: true },
    { name: "Proxy Manager",icon: "", url: "http://192.168.0.10:81",          sub: "nginx proxy manager", check: true },
    { name: "Pi-hole",      icon: "", url: "http://192.168.0.50/admin",       sub: "192.168.0.50", check: true },
  ]},
  { name: "Games", items: [
    { name: "Project Zomboid", icon: "\uf188", url: "http://192.168.0.10:8088/Docker", sub: "unraid docker", game: "pz" },
    { name: "Minecraft",    icon: "\uf1b2", url: "https://192.168.0.10:8443",       sub: "crafty panel", game: "minecraft" },
  ]},
  { name: "Media", items: [
    { name: "Jellyfin",     icon: "", url: "https://jellyfin.abrooks.dev",    sub: "movies, tv, music, books", check: true },
    { name: "qBittorrent",  icon: "", url: "http://192.168.0.10:8085",        sub: "via proton (gluetun)", check: true },
    { name: "Sonarr",       icon: "", url: "http://192.168.0.10:8989",        sub: "tv", check: true },
    { name: "Radarr",       icon: "", url: "http://192.168.0.10:7878",        sub: "movies", check: true },
    { name: "Lidarr",       icon: "", url: "http://192.168.0.10:8686",        sub: "music", check: true },
    { name: "Bookshelf",    icon: "", url: "http://192.168.0.10:8787",        sub: "books", check: true },
    { name: "Prowlarr",     icon: "", url: "http://192.168.0.10:9696",        sub: "indexers", check: true },
  ]},
  { name: "Personal cloud", items: [
    { name: "Vaultwarden",  icon: "\uf084", url: "https://vault.abrooks.dev",       sub: "passwords", helper: "vaultwarden" },  // CORP same-origin blocks browsers: checked by stack-status
    { name: "Seafile",      icon: "", url: "https://drive.abrooks.dev",       sub: "drive", check: true },
    { name: "Forgejo",      icon: "", url: "https://git.abrooks.dev",         sub: "git", check: true },
    { name: "Radicale",     icon: "", url: "https://dav.abrooks.dev/.web/",   sub: "contacts + calendar", check: true },
  ]},
  { name: "Network", items: [
    { name: "Tailscale",    icon: "", url: "https://login.tailscale.com/admin/machines", sub: "tailnet admin", check: true },
    { name: "Cloudflare",   icon: "\uf0c2", url: "https://dash.cloudflare.com",     sub: "dns", check: true, checkUrl: "https://1.1.1.1/cdn-cgi/trace" },
    { name: "Router",       icon: "", url: "http://192.168.0.1",              sub: "tp-link", check: true },
    { name: "Proton",       icon: "", url: "https://account.proton.me",       sub: "account", check: true },
  ]},
  { name: "Sites", items: [
    { name: "abrooks.dev",  icon: "", url: "https://abrooks.dev",             sub: "portfolio", check: true },
    { name: "GitHub",       icon: "", url: "https://github.com/AlecBrooks",   sub: "AlecBrooks", check: true },
  ]},
];

const main = document.getElementById("groups");
const tiles = [];
for (const g of GROUPS) {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>${g.name}</h2><div class="grid"></div>`;
  const grid = sec.querySelector(".grid");
  for (const it of g.items) {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = it.url;
    a.innerHTML = `<span class="icon">${it.icon}</span>
      <span class="text"><span class="name">${it.name}</span><span class="sub">${it.sub}</span></span>
      <span class="dot ${it.check || it.game || it.helper ? "checking" : "unknown"}"></span>`;
    grid.appendChild(a);
    tiles.push({ el: a, sec, key: (it.name + " " + it.sub + " " + g.name).toLowerCase(), it });
  }
  main.appendChild(sec);
}

// status dots: any response (even opaque) = up; network error or 4 s timeout = down
async function ping(t) {
  const dot = t.el.querySelector(".dot");
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 4000);
  try {
    await fetch(t.it.checkUrl || t.it.url, { mode: "no-cors", cache: "no-store", signal: ctl.signal });
    dot.className = "dot up"; t.el.title = "reachable";
  } catch {
    dot.className = "dot down"; t.el.title = "not reachable";
  } finally { clearTimeout(timer); }
}
// games: browsers cannot probe game protocols, so ask the stack-status helper on the server
async function games() {
  const gt = tiles.filter(t => t.it.game || t.it.helper);
  let data = null;
  try {
    const r = await fetch("http://192.168.0.10:8091/", { cache: "no-store" });
    data = await r.json();
  } catch {}
  for (const t of gt) {
    const dot = t.el.querySelector(".dot"), sub = t.el.querySelector(".sub");
    const g = data && data[t.it.game || t.it.helper];
    if (t.it.helper) {                       // plain service: up/down, keep its subtitle
      dot.className = !g ? "dot unknown" : g.state === "online" ? "dot up" : "dot down";
      continue;
    }
    if (!g) { dot.className = "dot unknown"; sub.textContent = "status helper unreachable"; continue; }
    if (g.state === "online") {
      dot.className = "dot up";
      sub.textContent = g.players != null ? `online, ${g.players}/${g.max} players` : "online";
    } else if (g.state === "starting") {
      dot.className = "dot checking"; sub.textContent = "starting up";
    } else {
      dot.className = "dot off"; sub.textContent = "off, " + t.it.sub;
    }
  }
}
const checkAll = () => { tiles.filter(t => t.it.check).forEach(ping); games(); };
checkAll();
setInterval(checkAll, 60000);

// type to filter; Enter opens the first match; Esc clears
const filter = document.getElementById("filter");
function applyFilter() {
  const q = filter.value.trim().toLowerCase();
  for (const t of tiles) t.el.classList.toggle("hidden", q && !t.key.includes(q));
  for (const sec of main.children) sec.classList.toggle("hidden", !sec.querySelector(".tile:not(.hidden)"));
  tiles.forEach(t => t.el.classList.remove("first"));
  const first = tiles.find(t => !t.el.classList.contains("hidden"));
  if (q && first) first.el.classList.add("first");
}
filter.addEventListener("input", applyFilter);
filter.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const first = tiles.find(t => !t.el.classList.contains("hidden"));
    if (first) location.href = first.it.url;
  } else if (e.key === "Escape") { filter.value = ""; applyFilter(); }
});
document.addEventListener("keydown", e => {
  if (document.activeElement !== filter && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) filter.focus();
});

// clock (12 h, like the bar)
const clock = document.getElementById("clock");
const tick = () => clock.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
