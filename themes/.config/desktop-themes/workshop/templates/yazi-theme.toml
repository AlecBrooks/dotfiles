# Generated by matugen (wallpaper-theme, workshop theme): yazi's theme while the workshop theme is
# active (~/bin/yazi points YAZI_CONFIG_HOME at a folder with it). Flat amber blocks, hairline borders.
[mgr]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }
find_keyword  = { fg = "{{colors.yellow.default.hex}}", bold = true, underline = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bold = true }
marker_copied   = { fg = "{{colors.green.default.hex}}", bg = "{{colors.green.default.hex}}" }
marker_cut      = { fg = "{{colors.red.default.hex}}", bg = "{{colors.red.default.hex}}" }
marker_marked   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_copied   = { fg = "{{colors.background.default.hex}}", bg = "{{colors.green.default.hex}}" }
count_cut      = { fg = "{{colors.background.default.hex}}", bg = "{{colors.red.default.hex}}" }
count_selected = { fg = "{{colors.background.default.hex}}", bg = "{{colors.primary.default.hex}}" }
border_symbol = "│"
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.outline.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
select_main = { fg = "{{colors.background.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
unset_main  = { fg = "{{colors.background.default.hex}}", bg = "{{colors.red.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.red.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[indicator]
parent  = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
current = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
preview = { underline = true }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep   = { fg = "{{colors.outline_variant.default.hex}}" }
perm_type  = { fg = "{{colors.primary.default.hex}}" }
perm_read  = { fg = "{{colors.yellow.default.hex}}" }
perm_write = { fg = "{{colors.red.default.hex}}" }
perm_exec  = { fg = "{{colors.tertiary.default.hex}}" }
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error  = { fg = "{{colors.red.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[which]
border = { fg = "{{colors.outline_variant.default.hex}}" }
cand   = { fg = "{{colors.primary.default.hex}}" }
rest   = { fg = "{{colors.outline.default.hex}}" }
desc   = { fg = "{{colors.on_surface.default.hex}}" }
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }

[confirm]
border = { fg = "{{colors.primary.default.hex}}" }
title  = { fg = "{{colors.primary.default.hex}}" }

[spot]
border   = { fg = "{{colors.outline_variant.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.yellow.default.hex}}", reversed = true }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}" }
title_warn  = { fg = "{{colors.yellow.default.hex}}" }
title_error = { fg = "{{colors.red.default.hex}}" }

[pick]
border = { fg = "{{colors.outline_variant.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}", bold = true }

[input]
border = { fg = "{{colors.primary.default.hex}}" }

[cmp]
border = { fg = "{{colors.outline_variant.default.hex}}" }

[tasks]
border  = { fg = "{{colors.outline_variant.default.hex}}" }
hovered = { fg = "{{colors.primary.default.hex}}", bold = true }

[help]
border  = { fg = "{{colors.outline_variant.default.hex}}" }
chord   = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }

# Names: folders amber (structure), everything else readable off-white, media/archives quieter.
[filetype]
rules = [
    { url = "*/", fg = "{{colors.primary.default.hex}}" },
    { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
    { mime = "application/{zip,gzip,x-tar,x-bzip*,x-7z-compressed,x-xz,x-rar,zstd}", fg = "{{colors.magenta.default.hex}}" },
    { url = "*", is = "orphan", fg = "{{colors.red.default.hex}}" },
    { url = "*", is = "exec", fg = "{{colors.green.default.hex}}" },
    { url = "*", fg = "{{colors.on_surface.default.hex}}" },
]

[icon]
# yazi's own named-folder icons (Downloads, Music, .config...) come in their own colors; same amber folder here.
prepend_dirs = [
    { name = ".config", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = ".git", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = ".github", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = ".npm", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Desktop", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Development", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Documents", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Downloads", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Library", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Movies", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Music", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Pictures", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Public", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Templates", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Videos", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Photos", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
    { name = "Video", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
]
prepend_conds = [
    { if = "dir", text = "󰉋", fg = "{{colors.primary.default.hex}}" },
]
