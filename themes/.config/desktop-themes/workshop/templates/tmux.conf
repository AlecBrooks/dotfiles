# Generated by matugen (wallpaper-theme, workshop theme). Sourced while the workshop theme is active;
# its hook unsets every option set here when switching back. Edit the template in the theme folder.
# The bar sits on kitty's glass (bg=default); the session is the one lit block, like the bar's sheet mark.
set -g status-style "bg=default,fg={{colors.outline.default.hex}}"
set -g status-left-length 40
set -g status-left "#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold] #{=20:session_name} #[default] "
set -g status-right-length 80
set -g status-right "#[fg={{colors.outline.default.hex}}]#{=-50:pane_current_path}  #[fg={{colors.on_surface.default.hex}}]%I:%M %p "
set -g window-status-format "#[fg={{colors.outline.default.hex}}] #I #W "
set -g window-status-current-format "#[fg={{colors.primary.default.hex}},bold] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g message-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-command-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.primary.default.hex}}"
set -g mode-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"
