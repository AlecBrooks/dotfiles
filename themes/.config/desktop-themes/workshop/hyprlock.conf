# Workshop lock screen (started by ~/bin/lock while the workshop theme is active).
# One panel on the blurred desk: a header strip that says what this is (the machine, locked), the
# time and date as the readouts, and the password field. Nothing decorative.
source = ~/.cache/wallpaper-theme/hyprlock-colors.conf

$font  = IBM Plex Sans Condensed
$mono  = JetBrainsMono Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Whatever was on screen, blurred and darkened: you see that the desk is still there, not what's on it.
background {
    monitor =
    path = screenshot
    color = $ink
    blur_passes = 4
    blur_size = 8
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.0
}

# The panel
shape {
    monitor =
    size = 460, 300
    color = $glass
    rounding = 0
    border_size = 1
    border_color = $rule
    position = 0, 0
    halign = center
    valign = center
}

# Header strip: amber block, like the bar's sheet mark.
shape {
    monitor =
    size = 460, 26
    color = $accent
    rounding = 0
    position = 0, 137
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[] echo "$(cat /etc/hostname | tr a-z A-Z)  ·  LOCKED"
    color = $onacc
    font_size = 10
    font_family = $font
    position = -212, 137
    halign = center
    valign = center
    text_align = left
    zindex = 1
}
label {
    monitor =
    text = $USER
    color = $onacc
    font_size = 10
    font_family = $mono
    position = 190, 137
    halign = center
    valign = center
    zindex = 1
}

# Time (the readout) and its label
label {
    monitor =
    text = TIME
    color = $muted
    font_size = 8
    font_family = $font
    position = -180, 92
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = $fg
    font_size = 44
    font_family = $font
    position = 0, 58
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B %Y" | tr a-z A-Z
    color = $muted
    font_size = 10
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

# Hairline between readouts and input
shape {
    monitor =
    size = 400, 1
    color = $rule
    rounding = 0
    position = 0, -16
    halign = center
    valign = center
}

label {
    monitor =
    text = PASSWORD
    color = $muted
    font_size = 8
    font_family = $font
    position = -168, -42
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 400, 36
    outline_thickness = 1
    rounding = 0
    outer_color = $rule
    inner_color = $ink
    font_color = $fg
    font_family = $mono
    check_color = $accent
    fail_color = $fail
    capslock_color = $hi
    dots_text_format = *
    dots_center = false
    fade_on_empty = false
    placeholder_text =
    fail_text = DENIED  ·  ATTEMPT $ATTEMPTS
    position = 0, -78
    halign = center
    valign = center
}
